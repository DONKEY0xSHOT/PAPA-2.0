name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Build (Debug + ASan)
        run: |
          cmake -S . -B build-debug -G "Visual Studio 17 2022" -A x64 -DPAPA_ENABLE_SANITIZERS=ON
          cmake --build build-debug --config Debug --parallel

      - name: Test (Debug)
        run: ctest --test-dir build-debug --output-on-failure -C Debug

  linux-clang:
    name: Linux / Clang
    runs-on: ubuntu-22.04
    env:
      CC: clang-15
      CXX: clang++-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 clang-tidy-15 cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DPAPA_ENABLE_SANITIZERS=ON

      - name: Build (Debug)
        run: cmake --build build-debug --parallel

      - name: Test (Debug)
        run: ctest --test-dir build-debug --output-on-failure

  linux-gcc:
    name: Linux / GCC
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    env:
      CC: clang-15
      CXX: clang++-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 clang-tidy-15 cmake ninja-build

      - name: Configure (export compile commands)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy on PAPA sources
        run: |
          set -euo pipefail
          files=$(find src tools tests/unit -name '*.cpp' -o -name '*.h' | tr '\n' ' ')
          clang-tidy-15 -p build ${files}
