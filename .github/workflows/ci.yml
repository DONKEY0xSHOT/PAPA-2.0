name: CI

# The blocking checks run in parallel. A push to main that changes code then
# publishes a release once every check has passed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules a compiler cannot catch: comment style, non-ASCII, and personal
      # paths. The language subset and warnings are enforced by the build itself
      - name: Check coding standards
        run: python3 tools/check_standards.py

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a version rather than the image default. clang-tidy check
      # behaviour changes between releases, so an unpinned tool moves the gate
      - name: Install clang-tidy and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 ninja-build

      # A configure is enough to produce compile_commands.json, which is all
      # clang-tidy needs. The checks themselves live in .clang-tidy
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # No flags here on purpose. The check set, the header filter and which
      # findings are fatal all live in .clang-tidy, so a local run matches CI
      - name: Run clang-tidy
        run: |
          files=$(git ls-files 'src/**/*.cpp' 'tools/**/*.cpp')
          echo "$files" | tr ' ' '\n'
          clang-tidy-18 -p build-tidy $files

  asan:
    name: ASan (Windows, MSVC)
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Debug, because the sanitizer flags are gated on that configuration. The
      # static CRT is the pairing whose ASan thunk the toolset actually ships
      - name: Configure
        run: >
          cmake -S . -B build-asan -G "Visual Studio 17 2022" -A x64
          -DPAPA_ENABLE_SANITIZERS=ON
          -DPAPA_STATIC_RUNTIME=ON

      - name: Build (Debug)
        run: cmake --build build-asan --config Debug --parallel

      # The instrumented binary loads the ASan runtime DLL at startup, and it is
      # not on PATH by default, so without this the tests exit before they run
      - name: Put the ASan runtime on PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                 Sort-Object Name -Descending |
                 ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } |
                 Where-Object { Test-Path (Join-Path $_ 'clang_rt.asan_dynamic-x86_64.dll') } |
                 Select-Object -First 1
          if (-not $dir) { throw "ASan runtime DLL not found under $vs" }
          Write-Host "ASan runtime: $dir"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      # abort_on_error turns a report into a crash, so the step cannot pass while
      # printing one. Leak detection is not available in the MSVC runtime
      - name: Unit tests under ASan
        env:
          ASAN_OPTIONS: abort_on_error=1
        run: ./build-asan/tests/unit/Debug/papa_unit_tests.exe

  build-and-test:
    name: Build and test (Windows, Release)
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build flags live in the project's CMake and warnings are errors. The version
      # is the release job's tag number, so the released papa.exe reports its own tag
      - name: Configure (CMake, Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPAPA_STATIC_RUNTIME=ON "-DPAPA_VERSION=0.1.${{ github.run_number }}"

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        run: ctest --test-dir build --output-on-failure -C Release

      # PAPA ships as a single self-contained executable
      - name: Verify papa.exe has no C/C++ runtime dependency
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
                     Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin.FullName /dependents build\tools\papa\Release\papa.exe
          $deps | Write-Host
          $forbidden = $deps | Select-String -Pattern 'MSVCP\d|VCRUNTIME|api-ms-win-crt|MSVCR\d'
          if ($forbidden) {
            throw "papa.exe depends on the C/C++ runtime: $($forbidden -join ', ')"
          }
          Write-Host "OK: papa.exe imports no C/C++ runtime DLL"

      - name: Upload papa.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papa-exe
          path: build/tools/papa/Release/papa.exe
          if-no-files-found: error

  release:
    name: Release on code change
    needs: [standards, clang-tidy, asan, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for the change diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is cut only when the push touched code
      - name: Detect code changes
        id: detect
        shell: bash
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          else
            base="$before"
          fi
          changed="$(git diff --name-only "$base" '${{ github.sha }}')"
          printf 'changed files:\n%s\n' "$changed"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|include/*|tools/papa/*|cmake/*|third_party/*|CMakeLists.txt) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Download papa.exe
        if: steps.detect.outputs.code == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: papa-exe
          path: dist

      - name: Create release
        if: steps.detect.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" \
            --title "$tag" \
            --target "${{ github.sha }}" \
            --generate-notes \
            dist/papa.exe LICENSE NOTICE
